<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>важливе питання 🐱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style/styles.css">
<body>
  <div class="container">
    <div class="gif_container">
      <img src="https://media.giphy.com/media/LnKonfpQ44fNvuGLkA/giphy.gif" alt="cute cats">
    </div>
    <h1>Would you go watch<br><span>Dangerlyoha</span><br>with me? 🥺</h1>
    
    <div class="buttons">
      <button class="btn btn-yes" onclick="nextPage()">Yes 🐱</button>
      <button class="btn btn-no" id="noBtn" onmouseover="runAway()" onclick="runAway()">No</button>
    </div>
  </div>

  <script>
    let tries = 0;
    function runAway() {
      tries++;
      const btn = document.getElementById('noBtn');
      const x = Math.random() * (window.innerWidth - btn.offsetWidth - 20);
      const y = Math.random() * (window.innerHeight - btn.offsetHeight - 20);
      btn.style.position = 'fixed';
      btn.style.left = x + 'px';
      btn.style.top = y + 'px';
      btn.style.zIndex = 999;
      if (tries >= 4) {
        btn.style.opacity = '0';
        btn.style.pointerEvents = 'none';
      }
    }
    function nextPage() {
      window.location.href = 'yes.html';
    }
  </script>
</body>
</html>
